# Development stack: Postgres plus the API with autoreload.
#   docker compose up
# Source is bind-mounted, so edits take effect without a rebuild.

name: aviro-dev

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aviro
      POSTGRES_USER: aviro
      POSTGRES_PASSWORD: aviro
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Exposed so you can inspect the database with psql or a GUI from the host.
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aviro -d aviro"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      target: development
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:8000"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DJANGO_SECRET_KEY: dev-only-not-a-secret
      DATABASE_URL: postgres://aviro:aviro@db:5432/aviro
      DJANGO_LOG_LEVEL: INFO
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:3002
    volumes:
      # The whole project, minus the places container-only artefacts live.
      - .:/app
      - /app/staticfiles
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
